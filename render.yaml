services:
  - type: web
    name: pricladnoy-python-url-shortener
    runtime: docker
    plan: free
    region: frankfurt
    branch: project_3
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pricladnoy-python-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: pricladnoy-python-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30

databases:
  - name: pricladnoy-python-db
    databaseName: pricladnoy_python_db
    plan: free
    region: frankfurt
    ipAllowList: []

redis:
  - name: pricladnoy-python-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
